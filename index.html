<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terminal Ranúnculo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap">
<style>
/* Layout: una terminal nocturna sobre un cielo vivo; todo ocurre en un solo registro que crece hacia abajo. */
:root {
  --night: #070d22;
  --panel: rgba(12, 22, 52, 0.82);
  --line: #1f2f63;
  --ink: #dde5f8;
  --dim: #7c89b3;
  --sun: #f4c542;
  --sky: #74a5ff;
  --err: #ff8a80;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --verse: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--ink);
  font: 15px/1.6 var(--mono);
  overflow: hidden;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.wrap {
  position: relative; z-index: 1; height: 100%;
  display: flex; justify-content: center;
  padding-block: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.term {
  width: 100%; max-width: 760px; height: 100%;
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  box-shadow: 0 0 0 1px rgba(116,165,255,.05), 0 30px 80px rgba(0,0,0,.45);
  overflow: hidden;
}
.bar {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 9px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 12px; letter-spacing: .06em; text-transform: lowercase;
  color: var(--dim);
}
.bar b { color: var(--sun); font-weight: 500; }
.bar .lock { color: var(--sky); }
#log {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 16px 18px 8px;
  overscroll-behavior: contain;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
.ln { white-space: pre-wrap; word-break: break-word; min-height: 1.6em; }
.dim { color: var(--dim); }
.ok { color: var(--sun); }
.blue { color: var(--sky); }
.err { color: var(--err); }
.cmd .p { color: var(--sun); }
.cmd .p i { color: var(--sky); font-style: normal; }

.ls { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 2px 0 6px; }
.ls button, .chips button {
  font: inherit; color: var(--sky); background: none; border: 0; padding: 2px 0;
  cursor: pointer; text-decoration: underline; text-decoration-color: rgba(116,165,255,.35);
  text-underline-offset: 3px;
}
.ls button.file { color: var(--ink); }
.ls button:hover, .ls button:focus-visible { color: var(--sun); text-decoration-color: var(--sun); outline: none; }

.inputrow {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 18px 12px;
  border-top: 1px solid var(--line);
}
.inputrow .p { color: var(--sun); white-space: nowrap; }
.inputrow .p i { color: var(--sky); font-style: normal; }
#cmd {
  flex: 1; min-width: 0;
  font: inherit; font-size: 16px; color: var(--ink);
  background: transparent; border: 0; outline: none;
  caret-color: var(--sun);
  letter-spacing: .05em;
}
#cmd.pin { letter-spacing: .5em; }
#cmd::placeholder { color: var(--dim); letter-spacing: .05em; }
.chips {
  display: flex; gap: 6px; flex-wrap: wrap;
  padding: 0 18px 12px;
}
.chips button {
  text-decoration: none; font-size: 13px;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
  color: var(--dim);
}
.chips button:hover, .chips button:focus-visible { color: var(--sun); border-color: var(--sun); outline: none; }

.bar-progress { color: var(--sun); }

/* vistas */
.view {
  margin: 10px 0 16px;
  border-left: 2px solid var(--sun);
  padding: 4px 0 4px 16px;
  animation: rise .6s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.intro { max-width: 40em; }
.intro p { margin: 0 0 .8em; text-wrap: pretty; }
.intro p:last-child { margin-bottom: 0; }
.poem { font-family: var(--verse); font-style: italic; font-size: 21px; line-height: 1.55; max-width: 34em; }
.poem p { margin: 0 0 .9em; opacity: 0; animation: verse 1.4s ease forwards; text-wrap: pretty; }
.poem p:first-child::first-letter { color: var(--sun); font-size: 1.5em; }
@keyframes verse { to { opacity: 1; } }
.art figure { margin: 0; }
.art img {
  display: block; width: 100%; max-width: 440px; height: auto;
  border-radius: 4px; border: 1px solid var(--line); cursor: zoom-in;
}
.art figcaption { color: var(--dim); font-size: 12px; margin-top: 6px; }
.note { margin-top: 12px; max-width: 34em; }
.track {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.play {
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--night); background: var(--sun);
  font-weight: 600; text-decoration: none;
  padding: 9px 16px; border-radius: 999px;
}
.play:hover, .play:focus-visible { background: var(--sky); outline: none; }
.flower canvas { display: block; width: 100%; max-width: 340px; aspect-ratio: 1; height: auto; }
.latin { color: var(--dim); font-size: 12px; }
.latin em { color: var(--sun); font-style: italic; font-family: var(--verse); font-size: 15px; }

#zoom {
  position: fixed; inset: 0; z-index: 5;
  background: rgba(4,8,20,.94);
  display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  cursor: zoom-out;
}
#zoom img { max-width: 100%; max-height: 100%; object-fit: contain; }

@media (max-width: 520px) {
  body { font-size: 13.5px; }
  .wrap { padding-block: 8px; }
  #log { padding: 12px 14px 6px; }
  .inputrow { padding: 9px 14px 10px; }
  .chips { padding: 0 14px 10px; }
  .poem { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  .view, .poem p { animation: none; opacity: 1; }
}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <main class="term" aria-label="Terminal">
    <div class="bar">
      <span>con cariño <b>para</b> Alo</span>
      <span class="lock">● canal cifrado · aes-256</span>
    </div>
    <div id="log" aria-live="polite"></div>
    <form class="inputrow" id="form" autocomplete="off">
      <label class="p" id="prompt" for="cmd">clave:</label>
      <input id="cmd" type="password" inputmode="numeric" maxlength="6" placeholder="······" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go">
    </form>
    <div class="chips" id="chips" hidden></div>
  </main>
</div>
<div id="zoom" hidden></div>

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- cielo ---------- */
  const sky = document.getElementById("sky"), sx = sky.getContext("2d");
  let stars = [], shoot = null, W = 0, H = 0, dpr = 1;
  function sizeSky() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = sky.clientWidth; H = sky.clientHeight;
    sky.width = W * dpr; sky.height = H * dpr;
    sx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(W * H / 2600);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() < .08 ? 1.5 + Math.random() : .4 + Math.random() * .8,
      p: Math.random() * Math.PI * 2, s: .4 + Math.random() * 1.4,
      c: Math.random() < .18 ? "244,197,66" : (Math.random() < .5 ? "116,165,255" : "221,229,248")
    }));
  }
  function drawSky(t) {
    sx.clearRect(0, 0, W, H);
    const g = sx.createRadialGradient(W * .8, H * .1, 0, W * .8, H * .1, Math.max(W, H));
    g.addColorStop(0, "rgba(40,60,140,.35)"); g.addColorStop(1, "rgba(7,13,34,0)");
    sx.fillStyle = g; sx.fillRect(0, 0, W, H);
    for (const s of stars) {
      const a = reduced ? .7 : .35 + .65 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
      sx.fillStyle = `rgba(${s.c},${a})`;
      sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, Math.PI * 2); sx.fill();
    }
    if (!reduced) {
      if (!shoot && Math.random() < .003) shoot = { x: Math.random() * W * .7, y: Math.random() * H * .4, l: 0 };
      if (shoot) {
        shoot.l += 14;
        const x2 = shoot.x + shoot.l, y2 = shoot.y + shoot.l * .45;
        const lg = sx.createLinearGradient(x2 - 120, y2 - 54, x2, y2);
        lg.addColorStop(0, "rgba(244,197,66,0)"); lg.addColorStop(1, "rgba(244,197,66,.9)");
        sx.strokeStyle = lg; sx.lineWidth = 1.4;
        sx.beginPath(); sx.moveTo(x2 - 120, y2 - 54); sx.lineTo(x2, y2); sx.stroke();
        if (shoot.l > 420) shoot = null;
      }
      requestAnimationFrame(drawSky);
    }
  }
  sizeSky(); addEventListener("resize", () => { sizeSky(); if (reduced) drawSky(0); });
  requestAnimationFrame(drawSky);

  /* ---------- terminal ---------- */
  const log = document.getElementById("log"), form = document.getElementById("form");
  const input = document.getElementById("cmd"), promptEl = document.getElementById("prompt");
  const chips = document.getElementById("chips"), zoom = document.getElementById("zoom");
  const sleep = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));
  const scroll = () => { log.scrollTop = log.scrollHeight; };
  function line(text = "", cls = "") {
    const d = document.createElement("div"); d.className = "ln " + cls; d.textContent = text;
    log.appendChild(d); scroll(); return d;
  }
  async function type(text, cls = "", speed = 22) {
    const d = line("", cls);
    if (reduced) { d.textContent = text; return d; }
    for (const ch of text) { d.textContent += ch; scroll(); await sleep(speed); }
    return d;
  }
  function node(el) { log.appendChild(el); scroll(); return el; }

  let mode = "boot", tries = 0, data = null, cwd = "~", busy = false;

  async function boot() {
    input.disabled = true;
    await type("conectando a nodo-hidalgo ...", "dim", 18);
    await sleep(250);
    line("[ ok ] handshake completado", "ok");
    line("[ ok ] contenido cifrado con aes-256-gcm", "ok");
    await sleep(200);
    line("");
    await type("acceso restringido. este sistema tiene una sola usuaria.", "", 20);
    await type("pista: fecha (ddmmaa)", "blue", 20);
    line("");
    mode = "login"; input.disabled = false; input.focus({ preventScroll: true });
  }

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function decrypt(pin) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(PAYLOAD.s), iterations: PAYLOAD.n, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.i) }, key, b64(PAYLOAD.c));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  async function login(pin) {
    line("clave: " + "•".repeat(pin.length), "dim");
    if (!/^\d{6}$/.test(pin)) { line("la clave son 6 números, en formato ddmmaa.", "err"); return; }
    busy = true; input.disabled = true;
    const bar = line("", "bar-progress");
    let k = 0; const spin = setInterval(() => { k = (k + 1) % 11; bar.textContent = "verificando [" + "#".repeat(k) + "·".repeat(10 - k) + "]"; }, 70);
    try {
      data = await decrypt(pin);
      clearInterval(spin); bar.textContent = "descifrando [##########] 100%";
      await sleep(300);
      line("[ ok ] acceso concedido", "ok");
      line("");
      await type("hola. esto es para ti.", "", 26);
      await type("hay cuatro carpetas. ábrelas en el orden que quieras.", "", 26);
      line("");
      mode = "shell";
      input.type = "text"; input.removeAttribute("maxlength"); input.inputMode = "text";
      input.classList.remove("pin"); input.placeholder = "escribe un comando o toca una carpeta";
      input.setAttribute("enterkeyhint", "send");
      setPrompt(); buildChips();
      run("ls", true);
      run("help", true);
    } catch (e) {
      clearInterval(spin);
      tries++;
      bar.textContent = "verificando [xxxxxxxxxx]";
      bar.className = "ln err";
      line("acceso denegado. esa no es la fecha.", "err");
      if (tries === 3) line("pista: día, mes y año, dos dígitos cada uno. sin espacios.", "blue");
      if (tries === 5) line("pista: el mes es noviembre.", "blue");
    }
    busy = false; input.disabled = false; input.focus({ preventScroll: true });
  }

  function setPrompt() {
    promptEl.innerHTML = 'alo@linda:<i>' + cwd + '</i>$';
  }
  function echo(cmd) {
    const d = document.createElement("div"); d.className = "ln cmd";
    const p = document.createElement("span"); p.className = "p";
    p.innerHTML = 'alo@linda:<i>' + cwd + '</i>$ ';
    d.append(p, document.createTextNode(cmd)); node(d);
  }

  const FS = {
    poesia: { files: ["poema.txt"], open: showPoem },
    arte:   { files: ["girasoles.png", "nota.txt"], open: showArt },
    musica: { files: ["playlist.m3u"], open: showMusic },
    flores: { files: ["anemona.sh"], open: showFlower }
  };
  const FILEMAP = { "poema.txt": "poesia", "girasoles.png": "arte", "nota.txt": "arte", "playlist.m3u": "musica", "anemona.sh": "flores" };

  function buildChips() {
    chips.hidden = false; chips.innerHTML = "";
    for (const c of ["poesia", "arte", "musica", "flores", "ls", "clear"]) {
      const b = document.createElement("button"); b.type = "button";
      b.textContent = FS[c] ? c + "/" : c;
      b.addEventListener("click", () => run(FS[c] ? "cd " + c : c));
      chips.appendChild(b);
    }
  }
  function lsView(entries) {
    const box = document.createElement("div"); box.className = "ls";
    for (const [label, cmd, isFile] of entries) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = label;
      if (isFile) b.className = "file";
      b.addEventListener("click", () => run(cmd));
      box.appendChild(b);
    }
    node(box);
  }

  function run(raw, silent) {
    const cmd = raw.trim().replace(/\s+/g, " ");
    if (!cmd) return;
    if (!silent || true) echo(cmd);
    const [c, ...rest] = cmd.split(" "); const arg = (rest.join(" ") || "").replace(/^\.?\/?|\/$/g, "").toLowerCase();
    switch (c.toLowerCase()) {
      case "help":
        line("comandos: ls · cd <carpeta> · cd .. · cat <archivo> · clear", "dim");
        line("o simplemente toca los nombres en azul.", "dim");
        break;
      case "ls":
        if (cwd === "~") lsView(Object.keys(FS).map(k => [k + "/", "cd " + k]));
        else lsView(FS[cwd.slice(2)].files.map(f => [f, "cat " + f, true]).concat([["../", "cd ..", false]]));
        break;
      case "cd": {
        if (!arg || arg === "~" || arg === "..") { cwd = "~"; setPrompt(); break; }
        const dir = arg.replace(/^~\//, "");
        if (FS[dir]) { cwd = "~/" + dir; setPrompt(); FS[dir].open(); }
        else line("cd: no existe la carpeta '" + arg + "'", "err");
        break;
      }
      case "cat": case "open": case "./anemona.sh": case "sh": {
        const f = c.startsWith("./") ? "anemona.sh" : arg.split("/").pop();
        if (FILEMAP[f]) { cwd = "~/" + FILEMAP[f]; setPrompt(); FS[FILEMAP[f]].open(f); }
        else line(c + ": no encontré '" + arg + "'", "err");
        break;
      }
      case "clear": log.innerHTML = ""; break;
      case "whoami": line("la única usuaria de este sistema.", "ok"); break;
      case "sudo": line("no necesitas sudo. aquí ya tienes todos los permisos.", "ok"); break;
      case "exit": line("no hay salida. pero puedes volver cuando quieras.", "dim"); break;
      default:
        if (FS[c.toLowerCase()]) { run("cd " + c.toLowerCase()); return; }
        line(c + ": comando no encontrado. escribe help.", "err");
    }
    scroll();
  }

  /* ---------- vistas ---------- */
  function view(cls) { const v = document.createElement("section"); v.className = "view " + cls; return v; }

  function showPoem() {
    line("cat leeme.txt", "dim");
    const iv = view("intro");
    data.intro.forEach(t => { const p = document.createElement("p"); p.textContent = t; iv.appendChild(p); });
    node(iv);
    line("cat poema.txt", "dim");
    const v = view("poem");
    data.poem.forEach((t, i) => {
      const p = document.createElement("p"); p.textContent = t;
      p.style.animationDelay = (reduced ? 0 : i * 1.1) + "s"; v.appendChild(p);
    });
    node(v);
  }

  function showArt(f) {
    const v = view("art");
    if (f !== "nota.txt") {
      line("open girasoles.png", "dim");
      const fig = document.createElement("figure");
      const img = document.createElement("img"); img.src = data.img; img.alt = "Girasoles en un jarrón, pintados con trazos gruesos";
      img.addEventListener("click", () => { zoom.innerHTML = ""; const z = img.cloneNode(); zoom.appendChild(z); zoom.hidden = false; });
      img.addEventListener("load", scroll);
      const cap = document.createElement("figcaption"); cap.textContent = "girasoles.png · toca para ampliar";
      fig.append(img, cap); v.appendChild(fig);
    }
    if (f !== "girasoles.png") {
      const n = document.createElement("div"); n.className = "note";
      n.innerHTML = '<div class="dim">cat nota.txt</div>' +
        '<div>esta pintura esconde algo.</div>';
      v.appendChild(n);
    }
    node(v);
  }
  zoom.addEventListener("click", () => { zoom.hidden = true; });

  function showMusic() {
    line("cat playlist.m3u", "dim");
    const v = view("music");
    const t = document.createElement("div"); t.className = "track";
    const a = document.createElement("a"); a.className = "play"; a.href = data.spotify; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "▶ escuchar en spotify";
    t.append(a); v.appendChild(t); node(v);
  }

  function showFlower() {
    line("./anemona.sh", "dim");
    const v = view("flower");
    const cv = document.createElement("canvas"); v.appendChild(cv);
    const lat = document.createElement("div"); lat.className = "latin";
    lat.innerHTML = '<em>Anemone coronaria</em> · familia ranunculaceae · del griego ánemos, viento';
    v.appendChild(lat); node(v);
    bloom(cv);
  }

  function bloom(cv) {
    const S = 340, d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = S * d; cv.height = S * d;
    const c = cv.getContext("2d"); c.setTransform(d, 0, 0, d, 0, 0);
    const start = performance.now(), dur = reduced ? 1 : 3000;
    const stamens = Array.from({ length: 46 }, (_, i) => ({ a: i * 2.399, r: 24 + Math.random() * 12 }));
    function petal(len, wid) {
      c.beginPath(); c.moveTo(0, 0);
      c.bezierCurveTo(wid * 1.1, -len * .15, wid * 1.05, -len * .95, 0, -len);
      c.bezierCurveTo(-wid * 1.05, -len * .95, -wid * 1.1, -len * .15, 0, 0);
    }
    function layer(n, len, wid, rot, open, light) {
      for (let j = 0; j < n; j++) {
        c.save(); c.rotate(rot + j * Math.PI * 2 / n);
        const L = len * open;
        petal(L, wid * open);
        const g = c.createLinearGradient(0, 0, 0, -L);
        g.addColorStop(0, "rgba(240,244,255,.95)");
        g.addColorStop(.22, `hsl(226, 70%, ${light - 12}%)`);
        g.addColorStop(1, `hsl(222, 85%, ${light + 12}%)`);
        c.fillStyle = g; c.fill();
        c.strokeStyle = "rgba(10,20,70,.35)"; c.lineWidth = .8; c.stroke();
        c.restore();
      }
    }
    function frame(now) {
      const t = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      c.clearRect(0, 0, S, S);
      c.save(); c.translate(S / 2, S / 2);
      const glow = c.createRadialGradient(0, 0, 10, 0, 0, 170);
      glow.addColorStop(0, "rgba(244,197,66,.18)"); glow.addColorStop(1, "rgba(244,197,66,0)");
      c.fillStyle = glow; c.fillRect(-S / 2, -S / 2, S, S);
      const twist = (1 - e) * .8;
      layer(6, 150, 62, .1 + twist, .3 + .7 * e, 48);
      layer(6, 120, 52, .1 + Math.PI / 6 - twist, .3 + .7 * Math.max(0, e * 1.15 - .15), 56);
      // centro oscuro con estambres
      const core = 22 * (.4 + .6 * e);
      c.fillStyle = "#0b0f2a"; c.beginPath(); c.arc(0, 0, core, 0, Math.PI * 2); c.fill();
      for (const s of stamens) {
        const r = s.r * (.4 + .6 * e);
        const x = Math.cos(s.a) * r, y = Math.sin(s.a) * r;
        c.strokeStyle = "rgba(11,15,42,.85)"; c.lineWidth = 1.2;
        c.beginPath(); c.moveTo(Math.cos(s.a) * core * .6, Math.sin(s.a) * core * .6); c.lineTo(x, y); c.stroke();
        c.fillStyle = e > .6 ? "#f4c542" : "#1b2150";
        c.beginPath(); c.arc(x, y, 2.1, 0, Math.PI * 2); c.fill();
      }
      c.fillStyle = "#1a2a6b"; c.beginPath(); c.arc(0, 0, core * .45, 0, Math.PI * 2); c.fill();
      c.restore();
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- entrada ---------- */
  input.classList.add("pin");
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (busy) return;
    const val = input.value; input.value = "";
    if (mode === "login") login(val.trim());
    else if (mode === "shell") run(val);
  });
  input.addEventListener("input", () => {
    if (mode === "login") {
      input.value = input.value.replace(/\D/g, "").slice(0, 6);
      if (input.value.length === 6 && !busy) { const v = input.value; input.value = ""; login(v); }
    }
  });
  if (!window.crypto || !crypto.subtle) {
    line("este navegador no permite descifrar el contenido. ábrelo en chrome o safari actualizados.", "err");
  } else boot();
})();
</script>
